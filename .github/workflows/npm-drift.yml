name: npm drift

on:
  schedule:
    # Mondays 09:00 UTC — catch a silently failed publish within a week.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo

            let tag
            try {
              const release = await github.rest.repos.getLatestRelease({ owner, repo })
              tag = release.data.tag_name.replace(/^v/, "")
            } catch (error) {
              core.warning(`Could not read the latest GitHub release: ${error.message}`)
              return
            }

            let npmVersion
            try {
              const response = await fetch(
                "https://registry.npmjs.org/@hueyexe%2Fopencode-ensemble/latest",
                { headers: { accept: "application/json" } },
              )
              if (!response.ok) throw new Error(`registry returned ${response.status}`)
              const data = await response.json()
              npmVersion = data.version
            } catch (error) {
              core.warning(`Could not read the registry latest version: ${error.message}`)
              return
            }

            if (npmVersion === tag) {
              core.info(`npm latest ${npmVersion} matches GitHub release ${tag}`)
              return
            }

            const title = "npm drift detected"
            const body = [
              "The published npm package and the newest GitHub release have diverged.",
              "",
              `- npm \`latest\`: \`${npmVersion}\``,
              `- GitHub latest release: \`${tag}\``,
              "",
              "This is the failure mode from #49: a publish can fail (expired token, missing 2FA bypass) while the GitHub release still goes out, so users install an older version.",
              "",
              "Fix: publish the missing version with `bun publish --access public`, verify with `npm view @hueyexe/opencode-ensemble version`, then close this issue.",
            ].join("\n")

            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            })
            const open = existing.data.find((issue) => issue.title === title)
            if (open) {
              if (open.body !== body) {
                await github.rest.issues.update({ owner, repo, issue_number: open.number, body })
              }
              core.info("Updated the existing drift issue")
              return
            }

            await github.rest.issues.create({ owner, repo, title, body })
